# Redirects for the made-up store, as an nginx server block.
server {
    listen 443 ssl;
    server_name www.example.com;

    location = /about-us.html { return 301 /pages/about-us; }
    location = /contact.html { return 301 /pages/contact; }
    location = /shipping-returns.html { return 301 /pages/shipping-returns; }

    rewrite ^/women\.html$ /collections/women permanent;
    rewrite ^/women/dresses\.html$ /collections/women-dresses permanent;
    rewrite ^/women/tops\.html$ /collections/women-tops permanent;
    rewrite ^/men\.html$ /collections/men permanent;
    rewrite ^/sale\.html$ /collections/sale redirect;

    # A rule with a capture: reported, not guessed.
    rewrite ^/blog/(.*)\.html$ /blogs/journal/$1 permanent;

    # A prefix location: reported, not guessed.
    location /men/ {
        return 301 /collections/men;
    }
}
